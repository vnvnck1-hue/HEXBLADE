<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HEXBLADE · 로비 리소스 적용 미리보기</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c0c17;color:#f5eedb;font-family:'Malgun Gothic','맑은 고딕',sans-serif}#stage{width:1920px;height:1080px;position:absolute;overflow:hidden;transform-origin:0 0;background:#0c0c17}.art{position:absolute;pointer-events:none}.ui{position:absolute}.title{font-family:'Arial Black','Segoe UI',sans-serif;font-weight:950;font-style:italic;letter-spacing:-4px;line-height:1;white-space:nowrap}.subtitle{font-weight:bold;color:#a7b8d5;letter-spacing:1px}.menu{position:absolute;border:0;background:none;padding:0;text-align:left;cursor:pointer;color:#f5eedb;font-family:inherit;transition:transform .12s}.menu:focus{outline:none}.menu img.skin{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.menu .label{position:absolute;font-weight:900;font-style:italic;line-height:1.1;white-space:nowrap}.menu .sub{position:absolute;font-family:'Arial',sans-serif;font-weight:800;font-style:italic;color:#a7b8d5;line-height:1}.menu .arrow{position:absolute;width:48px;height:48px;opacity:.65}.menu.hot{color:#102019;transform:translateX(6px)}.menu.hot .sub{color:#264224}.menu.hot .arrow{opacity:1}.hint{position:absolute;color:#b5c4df;font-size:25px;font-weight:bold;line-height:66px;padding-left:44px;white-space:nowrap}.hint img{position:absolute;inset:0;width:100%;height:100%;z-index:-1}.extra{color:#7c8fae;font-weight:bold}.toolbar{position:fixed;right:12px;top:12px;z-index:100;color:#e9edff;background:#161627db;border:1px solid #525969;border-radius:5px;padding:8px;font-size:12px}.toolbar button{background:#292a39;border:1px solid #5c6573;color:#f1f2ec;padding:6px 9px;cursor:pointer}.toolbar button.active{border-color:#83fa43;color:#83fa43}#toast{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#10121ded;padding:12px 20px;border:1px solid #8afa4f;z-index:100;border-radius:4px;font-size:14px;display:none}#drawer{position:absolute;display:none;padding:28px 35px}.drawerbg{position:absolute;inset:0;width:100%;height:100%;z-index:-1}.drawerhead{height:66px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #777775}.drawerhead h2{font-size:36px;font-style:italic;margin:0}.drawerhead button{font:700 21px inherit;background:none;border:0;color:#cad4de;cursor:pointer}.drawerrows{overflow-y:auto;height:calc(100% - 100px);padding-top:14px;scrollbar-color:#87fa49 #242331}.drawerrow{display:block;width:100%;min-height:70px;font:700 23px 'Malgun Gothic',sans-serif;text-align:left;padding:12px 17px;background:#211f30;color:#eee7d8;border:1px solid #565464;margin:0 0 8px;cursor:pointer}.drawerrow small{display:block;font-size:14px;font-weight:400;color:#a7b8d5;margin-top:5px}.drawerrow:focus,.drawerrow:hover{background:#82ff43;color:#102019;outline:none}.drawerrow:focus small,.drawerrow:hover small{color:#254322}.export .toolbar{display:none}@media(prefers-reduced-motion:reduce){.menu{transition:none}}
.hint{z-index:10}.hint img{z-index:0}.hint span{position:relative;z-index:1}#drawer{z-index:20}.drawerbg{z-index:0}.drawerhead,.drawerrows{position:relative;z-index:1}.drawerrow{overflow-wrap:anywhere;line-height:1.35}.drawerrow small{line-height:1.4;font-size:15px}.drawerhead button{font-family:inherit;font-size:19px;font-weight:bold}
</style></head><body>
<div id="stage"></div>
<div class="toolbar">리소스 합성 미리보기 · 본편 미연결<br><button id="staticBtn">완성 배경</button> <button id="layeredBtn">분리 레이어</button> <button id="drawerBtn">테스트 목록</button></div>
<div id="toast"></div>
<script src="layout_data.js"></script><script src="test_scene_data.js"></script>
<script>
const L=globalThis.LOBBY_LAYOUT;const stage=document.querySelector('#stage');const qp=new URLSearchParams(location.search);let mode=qp.get('mode')==='layered'?'layered':'static';let selected=0;let opened=false;
if(qp.has('export'))document.body.classList.add('export');
function rect(el,r){Object.assign(el.style,{left:r[0]+'px',top:r[1]+'px',width:r[2]+'px',height:r[3]+'px'});return el}
function img(path,r,cls='art'){const el=new Image;el.src=path;el.className=cls;rect(el,r);stage.append(el);return el}
function text(txt,r,size,cls){const el=document.createElement('div');el.className='ui '+cls;el.textContent=txt;el.style.fontSize=size+'px';rect(el,r);stage.append(el);return el}
function notify(msg){const el=document.querySelector('#toast');el.textContent=msg;el.style.display='block';clearTimeout(globalThis.toastTimer);globalThis.toastTimer=setTimeout(()=>el.style.display='none',2800)}
function updateFocus(){document.querySelectorAll('.menu').forEach((b,i)=>{b.classList.toggle('hot',i===selected);b.querySelector('.skin').src='ui/'+(i===selected?'03_menu_focus.svg':'02_menu_normal.svg');b.querySelector('.arrow').src='ui/'+(i===selected?'08_arrow_ink.svg':'07_arrow_cream.svg')})}
function showDrawer(v){opened=v;document.querySelector('#drawer').style.display=v?'block':'none';document.querySelectorAll('.menu').forEach(b=>b.style.visibility=v?'hidden':'visible');if(v)document.querySelector('.drawerrow')?.focus();else document.querySelectorAll('.menu')[selected]?.focus()}
function render(){stage.replaceChildren();
 if(mode==='static')img(L.static.path,L.static.rect);else Object.values(L.layered).forEach(e=>img(e.path,e.rect));
 img('ui/01_logo_mark.svg',L.logo_mark,'art');img('ui/17_title_wordmark.svg',L.title_wordmark_rect);img('ui/10_logo_underline.svg',L.logo_underline);text(L.subtitle,L.subtitle_rect,L.subtitle_font_size,'subtitle');
 L.menus.forEach((m,i)=>{const b=document.createElement('button');b.className='menu';b.dataset.id=m.id;rect(b,m.rect);b.setAttribute('aria-label',m.title);b.innerHTML=`<img class="skin"><span class="label"></span><span class="sub"></span><img class="arrow">`;const label=b.querySelector('.label');label.textContent=m.title;label.style.cssText=`left:57px;top:${m.subtitle?20:38}px;font-size:${m.title_font_size}px`;const sub=b.querySelector('.sub');sub.textContent=m.subtitle;sub.style.cssText='left:57px;top:78px;font-size:25px';const arrow=b.querySelector('.arrow');arrow.style.right='59px';arrow.style.top='39px';b.onmouseenter=()=>{selected=i;updateFocus()};b.onfocus=()=>{selected=i;updateFocus()};b.onclick=()=>m.id==='test_scenes'?showDrawer(true):notify('적용 전 미리보기: '+m.title+' → '+m.existing_handler);stage.append(b)});
 const hint=text(L.hint_text,L.hint_rect,L.hint_font_size,'hint');hint.innerHTML='<img src="ui/11_hint_plate.svg"><span>'+L.hint_text+'</span>';text(L.extra_hint_text,L.extra_hint_rect,L.extra_hint_font_size,'extra');
 const drawer=document.createElement('div');drawer.id='drawer';rect(drawer,L.drawer_rect);drawer.innerHTML='<img class="drawerbg" src="ui/12_drawer_panel.svg"><div class="drawerhead"><h2>테스트 씬</h2><button>ESC 닫기 ×</button></div><div class="drawerrows"></div>';drawer.querySelector('.drawerhead button').onclick=()=>showDrawer(false);stage.append(drawer);
 const rows=drawer.querySelector('.drawerrows');globalThis.LOBBY_TEST_SCENES.forEach(s=>{const b=document.createElement('button');b.className='drawerrow';b.textContent=s.title;const small=document.createElement('small');small.textContent=s.desc;b.append(small);b.onclick=()=>notify('적용 전 미리보기 → '+s.scene);rows.append(b)});
 updateFocus();document.querySelector('#staticBtn').classList.toggle('active',mode==='static');document.querySelector('#layeredBtn').classList.toggle('active',mode==='layered');if(opened)showDrawer(true);resize();
}
function resize(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`scale(${s})`;stage.style.left=(innerWidth-1920*s)/2+'px';stage.style.top=(innerHeight-1080*s)/2+'px'}
document.querySelector('#staticBtn').onclick=()=>{mode='static';render()};document.querySelector('#layeredBtn').onclick=()=>{mode='layered';render()};document.querySelector('#drawerBtn').onclick=()=>showDrawer(!opened);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&opened){e.preventDefault();showDrawer(false);return}if(opened)return;if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();selected=(selected+(e.key==='ArrowDown'?1:-1)+L.menus.length)%L.menus.length;document.querySelectorAll('.menu')[selected].focus()}if(e.key==='Enter'&&document.activeElement===document.body){e.preventDefault();document.querySelectorAll('.menu')[selected].click()}});addEventListener('resize',resize);render();if(qp.has('drawer'))showDrawer(true);
</script></body></html>
