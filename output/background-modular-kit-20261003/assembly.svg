E5F54" stroke="#b9a7c8"/><rect x="388" y="184" width="116" height="14.5" fill="#CE5F54" stroke="#b9a7c8"/><rect x="388" y="169.5" width="116" height="14.5" fill="#CE5F54" stroke="#b9a7c8"/><rect x="388" y="155" width="116" height="14.5" fill="#CE5F54" stroke="#b9a7c8"/><text x="40" y="645" font-size="16" fill="#e6dfeb">+X → / +Z ↑ · F05 8장 = 오른쪽 위 2×2 대체 슬롯</text><text x="550" y="125" font-size="21" fill="#e6dfeb">B. 벽 정면 조립 / 동일 팔레트</text><rect x="550" y="165" width="600" height="225" fill="#8c819f" stroke="#b9a7c8"/><rect x="695" y="165" width="10" height="225" fill="#423665" stroke="#b9a7c8"/><rect x="845" y="165" width="10" height="225" fill="#423665" stroke="#b9a7c8"/><rect x="995" y="165" width="10" height="225" fill="#423665" stroke="#b9a7c8"/><rect x="550" y="381" width="600" height="9" fill="#423665" stroke="#b9a7c8"/><rect x="550" y="161" width="600" height="9" fill="#56438A" stroke="#b9a7c8"/><rect x="570" y="315" width="150" height="10" fill="#CE5F54" stroke="#b9a7c8"/><rect x="575" y="325" width="40" height="65" fill="#56438A" stroke="#b9a7c8"/><rect x="675" y="325" width="40" height="65" fill="#56438A" stroke="#b9a7c8"/><rect x="588" y="224" width="112.5" height="56.25" fill="#ac9caf" stroke="#b9a7c8"/><text x="598" y="258" font-size="18" fill="#e6dfeb">A04</text><rect x="608" y="195" width="75" height="11.25" fill="#AC41A6" stroke="#b9a7c8"/><text x="691" y="206" font-size="15" fill="#e6dfeb">A10</text><rect x="751" y="240" width="75" height="150" fill="#56438A" stroke="#b9a7c8"/><text x="765" y="310" font-size="18" fill="#e6dfeb">A02</text><rect x="865" y="227" width="75" height="112.5" fill="#68577b" stroke="#b9a7c8"/><text x="878" y="280" font-size="18" fill="#e6dfeb">A03</text><rect x="960" y="285" width="15" height="37.5" fill="#AC41A6" stroke="#b9a7c8"/><text x="978" y="303" font-size="15" fill="#e6dfeb">A11</text><ellipse cx="1080" cy="278" rx="19" ry="23" fill="none" stroke="#423665" stroke-width="7"/><text x="1056" y="325" font-size="15" fill="#e6dfeb">A13</text><text x="580" y="418" font-size="16" fill="#e6dfeb">A01 상면 Y=1 / A04 중심 Y=1.8 / A10 중심 Y=2.5</text><text x="550" y="461" font-size="16" fill="#e6dfeb">작업대 뒤 간격 .05 · 벽 덮개는 폭에 더하지 않음</text><text x="550" y="495" font-size="16" fill="#e6dfeb">A05·A08은 상판 위 / A09는 앞 모서리</text><text x="550" y="529" font-size="16" fill="#e6dfeb">주 배관 Ø.25 / A12 도관 Ø.08 — 직접 접속 금지</text><text x="550" y="563" font-size="16" fill="#e6dfeb">중앙 전투 바닥은 비움 · 감염은 가장자리에서 확장</text><text x="40" y="704" font-size="21" fill="#e6dfeb">C. 문 정면 / 닫힘과 열림 (배치 개념도)</text><rect x="40" y="750" width="260" height="270" fill="#6b5c7a" stroke="#b9a7c8"/><rect x="820" y="750" width="260" height="270" fill="#6b5c7a" stroke="#b9a7c8"/><rect x="300" y="750" width="520" height="45" fill="#423665" stroke="#b9a7c8"/><rect x="300" y="795" width="32.5" height="225" fill="#423665" stroke="#b9a7c8"/><rect x="787.5" y="795" width="32.5" height="225" fill="#423665" stroke="#b9a7c8"/><rect x="333.15" y="795.9" width="226.2" height="223.2" fill="#56438A" stroke="#b9a7c8"/><rect x="560.65" y="795.9" width="226.2" height="223.2" fill="#56438A" stroke="#b9a7c8"/><text x="440" y="895" font-size="20" fill="#e6dfeb">W05 ×2 / 1.74 × 2.48</text><text x="438" y="928" font-size="17" fill="#e6dfeb">중앙 .01 / 측면 .005</text><text x="405" y="782" font-size="19" fill="#e6dfeb">W04 4 × 3 / 통로 3.5 × 2.5</text><rect x="105.64999999999998" y="795.9" width="226.2" height="223.2" fill="none" stroke="#CE5F54" stroke-width="3" stroke-dasharray="8 5"/><rect x="788.15" y="795.9" width="226.2" height="223.2" fill="none" stroke="#CE5F54" stroke-width="3" stroke-dasharray="8 5"/><text x="62" y="866" font-size="19" fill="#e6dfeb">포켓 W01</text><text x="884" y="866" font-size="19" fill="#e6dfeb">포켓 W01</text><text x="62" y="899" font-size="17" fill="#e6dfeb">← 이동 1.75</text><text x="884" y="899" font-size="17" fill="#e6dfeb">이동 1.75 →</text><text x="40" y="1056" font-size="18" fill="#e6dfeb">깊이: 벽 Z 0~.25 / 빈 포켓 .04~.20 / 문짝 .06~.18 / 기둥에도 같은 슬릿</text><text x="40" y="1111" font-size="21" fill="#e6dfeb">D. 곡선 접속 / TOP (+X →, +Z ↑)</text><text x="55" y="1150" font-size="16" fill="#e6dfeb">D02 / r=0.5, Ø/폭=0.25</text><path d="M 190 1400 A 135 135 0 0 0 55 1265" fill="none" stroke="#CE5F54" stroke-width="67.5"/><path d="M 275 1400 H 55 V 1190" fill="none" stroke="#b9a7c8" stroke-width="1"/><text x="55" y="1425" font-size="14" fill="#e6dfeb">(0,0)</text><text x="170" y="1425" font-size="14" fill="#e6dfeb">(0.5,0)</text><text x="60" y="1240" font-size="14" fill="#e6dfeb">(0,0.5)</text><text x="340" y="1150" font-size="16" fill="#e6dfeb">P02 / r=0.5, Ø/폭=0.25</text><path d="M 475 1400 A 135 135 0 0 0 340 1265" fill="none" stroke="#56438A" stroke-width="67.5"/><path d="M 560 1400 H 340 V 1190" fill="none" stroke="#b9a7c8" stroke-width="1"/><text x="340" y="1425" font-size="14" fill="#e6dfeb">(0,0)</text><text x="455" y="1425" font-size="14" fill="#e6dfeb">(0.5,0)</text><text x="345" y="1240" font-size="14" fill="#e6dfeb">(0,0.5)</text><text x="625" y="1150" font-size="16" fill="#e6dfeb">R02 / r=0.25, Ø/폭=0.08</text><path d="M 692.5 1400 A 67.5 67.5 0 0 0 625 1332.5" fill="none" stroke="#CE5F54" stroke-width="21.6"/><path d="M 845 1400 H 625 V 1190" fill="none" stroke="#b9a7c8" stroke-width="1"/><text x="625" y="1425" font-size="14" fill="#e6dfeb">(0,0)</text><text x="740" y="1425" font-size="14" fill="#e6dfeb">(0.25,0)</text><text x="630" y="1307.5" font-size="14" fill="#e6dfeb">(0,0.25)</text><text x="910" y="1150" font-size="16" fill="#e6dfeb">I02 / r=0.25, Ø/폭=0.12</text><path d="M 977.5 1400 A 67.5 67.5 0 0 0 910 1332.5" fill="none" stroke="#6E4382" stroke-width="32.4"/><path d="M 1130 1400 H 910 V 1190" fill="none" stroke="#b9a7c8" stroke-width="1"/><text x="910" y="1425" font-size="14" fill="#e6dfeb">(0,0)</text><text x="1025" y="1425" font-size="14" fill="#e6dfeb">(0.25,0)</text><text x="915" y="1307.5" font-size="14" fill="#e6dfeb">(0,0.25)</text><text x="40" y="1475" font-size="18" fill="#e6dfeb">배관/줄기: 끝 중심 일치 + 법선 반대. 링은 접속마다 1개. 줄기는 금속 링 없이 목 Ø.12.</text><text x="40" y="1510" font-size="18" fill="#e6dfeb">I03 T분기: (-.5,.06,0) / (.5,.06,0) / (0,.06,.4). R 바 높이 .25/.95, 간격 .70.</text><text x="40" y="1550" font-size="18" fill="#e6dfeb">공통 512px/m · 2048px = 4m · BASE / TRIM / PROP / ORGANIC 분리</text></g></svg>