<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1610" viewBox="0 0 1200 1610"><title>HEXBLADE numeric assembly guide</title><rect width="1200" height="1610" fill="#252033"/><g font-family="Arial, Malgun Gothic, sans-serif"><text x="40" y="45" font-size="28" fill="#e6dfeb">HEXBLADE / 조립 치수 보조도</text><text x="40" y="77" font-size="16" fill="#e6dfeb">단위 m · PNG 컬러 시트의 보조 자료 · 좌표/치수 우선, 실제 메시 검증 아님</text><text x="40" y="125" font-size="21" fill="#e6dfeb">A. 8×8 바닥 대체 슬롯 / 총 30장, 64m²</text><rect x="40" y="503" width="116" height="116" fill="#56438A" stroke="#b9a7c8"/><text x="47" y="566" font-size="15" fill="#e6dfeb">F01</text><rect x="40" y="387" width="116" height="116" fill="#56438A" stroke="#b9a7c8"/><text x="47" y="450" font-size="15" fill="#e6dfeb">F01</text><rect x="40" y="271" width="116" height="116" fill="#56438A" stroke="#b9a7c8"/><text x="47" y="334" font-size="15" fill="#e6dfeb">F01</text><rect x="40" y="155" width="116" height="116" fill="#56438A" stroke="#b9a7c8"/><text x="47" y="218" font-size="15" fill="#e6dfeb">F01</text><rect x="156" y="503" width="116" height="116" fill="#56438A" stroke="#b9a7c8"/><text x="163" y="566" font-size="15" fill="#e6dfeb">F01</text><rect x="156" y="387" width="116" height="116" fill="#56438A" stroke="#b9a7c8"/><text x="163" y="450" font-size="15" fill="#e6dfeb">F01</text><rect x="156" y="271" width="116" height="116" fill="#56438A" stroke="#b9a7c8"/><text x="163" y="334" font-size="15" fill="#e6dfeb">F01</text><rect x="156" y="155" width="116" height="116" fill="#56438A" stroke="#b9a7c8"/><text x="163" y="218" font-size="15" fill="#e6dfeb">F01</text><rect x="272" y="503" width="116" height="116" fill="#56438A" stroke="#b9a7c8"/><text x="279" y="566" font-size="15" fill="#e6dfeb">F01</text><rect x="272" y="387" width="116" height="116" fill="#56438A" stroke="#b9a7c8"/><text x="279" y="450" font-size="15" fill="#e6dfeb">F01</text><rect x="272" y="271" width="116" height="116" fill="#56438A" stroke="#b9a7c8"/><tex